<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>CodeBench</title>
    <link rel="stylesheet" href="styles.css?v=20260827.12" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div>
            <div class="brand-title">LLM Evaluation</div>
            <div class="brand-subtitle">Competitive Programming</div>
          </div>
        </div>
        <button id="newChatBtn" class="new-chat-btn">+ New chat</button>
        <nav class="sidebar-menu">
          <a class="sidebar-item active" href="index.html">Home</a>
          <a class="sidebar-item" href="examples.html">Examples</a>
          <a class="sidebar-item" href="benchmark.html">Benchmark</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <h1>LLM Evaluation</h1>
            <p>Use the settings menu to customize prompt and model behavior.</p>
          </div>
          <div id="backendStatus" class="backend-status">Backend: checking...</div>
        </header>
        <button id="settingsButton" class="settings-fab" title="Open settings">Settings</button>

        <section class="chat-window" id="chatWindow"></section>

        <form id="chatForm" class="composer">
          <textarea id="messageInput" placeholder="Send a message..." rows="1"></textarea>
          <button type="submit" class="send-button">Send</button>
        </form>
      </main>

    </div>

    <script src="page-transitions.js?v=20260825"></script>
    <script src="settings-store.js?v=20260827.13"></script>
    <script src="app.js?v=20260827.12"></script>
  </body>
</html>
