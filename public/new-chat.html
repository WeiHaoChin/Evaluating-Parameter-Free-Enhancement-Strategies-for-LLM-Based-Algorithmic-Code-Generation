<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Chat - FYP Chat UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-icon">F</div>
          <div>
            <div class="brand-title">FYP Chat</div>
            <div class="brand-subtitle">New chat</div>
          </div>
        </div>
        <a class="sidebar-item" href="index.html">Back to chat</a>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <h1>New Chat</h1>
            <p>This is a separate page for a new conversation.</p>
          </div>
        </header>

        <section class="chat-window">
          <div class="message assistant">
            <strong>Assistant</strong>
            <div>Start typing in the main chat page or go back to resume the conversation.</div>
          </div>
        </section>
      </main>
    </div>
    <script src="page-transitions.js"></script>
  </body>
</html>
